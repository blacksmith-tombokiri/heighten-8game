name: Rebuild HEIGHTEN release

on:
  push:
    paths:
      - '.github/workflows/rebuild-heighten.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .build/p* | base64 --decode | gzip -d > index.html
          echo "db3d0a9b1ffaa8e093ce6bdf81edcf99453bec9e786fc85c251894b3460f39a4  index.html" | sha256sum -c -
      - name: Commit release file and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          rm -f .github/workflows/rebuild-heighten.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HEIGHTEN v1.4.0"
          git push
