<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEIGHTEN | 8-Game Poker Trainer</title>
<meta name="theme-color" content="#0d2d24">
<style>html,body{margin:0;min-height:100%;background:#07130f;color:#f1f2ec;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading strong{letter-spacing:.12em}.loading small{display:block;margin-top:10px;color:#9eb0a9}</style>
</head>
<body>
<div class="loading"><div><strong>HEIGHTEN</strong><small>Loading Mixed Game Trainer...</small></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
    const parts=await Promise.all(Array.from({length:7},async(_,i)=>{
      const path=`.build/p${String(i).padStart(2,'0')}`;
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error(`Failed to load ${path}`);
      return (await response.text()).trim();
    }));
    const encoded=parts.join('');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const mobileTableCss = "/* Mobile Table Layout v1.0 */\n@media (max-width: 680px) {\n  .table-wrap { width: 100%; row-gap: 10px; overflow: visible; }\n  .poker-table { width: min(100%, 520px); aspect-ratio: .82 / 1; border-width: 7px; border-radius: 46% / 50%; overflow: visible; }\n  .seat-top { left: 50%; top: 1.5%; transform: translateX(-50%); }\n  .seat-left-top { left: 1%; top: 19%; }\n  .seat-right-top { right: 1%; top: 19%; }\n  .seat-left-bottom { left: 1%; bottom: 19%; }\n  .seat-right-bottom { right: 1%; bottom: 19%; }\n  .seat-you { left: 50%; bottom: 1.5%; transform: translateX(-50%); }\n  .poker-seat { min-width: 82px; max-width: 126px; padding: 5px 5px 4px; border-radius: 10px; line-height: 1.12; }\n  .seat-name { font-size: 11px; white-space: nowrap; }\n  .position-badge { margin-left: 3px; padding: 1px 5px; font-size: 8px; }\n  .seat-stack { margin: 2px 0 4px; font-size: 9px; white-space: nowrap; }\n  .seat-action { min-height: 12px; margin-top: 3px; font-size: 9px; line-height: 1.15; }\n  .seat-bet { position: static; left: auto; transform: none; margin-top: 2px; font-size: 9px; line-height: 1.1; }\n  .seat-state { margin-top: 3px; padding: 1px 4px; font-size: 8px; }\n  .board { top: 52%; gap: 5px; z-index: 2; }\n  .board .card { width: clamp(26px, 7.4vw, 32px); }\n  .pot-label { top: 37%; z-index: 3; width: min(58%, 250px); text-align: center; font-size: 10px; line-height: 1.25; }\n  .pot-label strong { font-size: 16px; margin-left: 4px; }\n  .pot-breakdown { max-width: 100%; margin-top: 4px; gap: 3px 5px; font-size: 8px; }\n  .pot-breakdown span { padding: 1px 4px; }\n  .street-label { top: 64%; font-size: 9px; }\n  .table-mark { inset: 50% auto auto 50%; transform: translate(-50%, 72px); font-size: 14px; }\n  .poker-seat.has-four-cards { min-width: 112px; max-width: 122px; }\n  .poker-seat.has-four-cards .card { width: clamp(21px, 5.8vw, 25px); }\n  .poker-table-plo .seat-left-top, .poker-table-plo .seat-left-bottom { left: 0; }\n  .poker-table-plo .seat-right-top, .poker-table-plo .seat-right-bottom { right: 0; }\n  .poker-table-draw .poker-seat.has-five-cards { min-width: 116px; max-width: 126px; }\n  .poker-table-draw .poker-seat.has-five-cards .card { width: clamp(17px, 4.8vw, 21px); }\n  .poker-table-draw .seat-left-top, .poker-table-draw .seat-left-bottom { left: 0; }\n  .poker-table-draw .seat-right-top, .poker-table-draw .seat-right-bottom { right: 0; }\n  .draw-center { top: 52%; min-width: min(160px, 58%); max-width: 58%; padding: 7px 6px; gap: 3px; }\n  .poker-table-stud .poker-seat.has-stud-cards { min-width: 106px; max-width: 120px; }\n  .poker-table-stud .poker-seat.has-stud-cards .card { width: clamp(16px, 4.5vw, 19px); border-radius: 3px; font-size: 9px; }\n  .poker-table-stud .seat-left-top, .poker-table-stud .seat-left-bottom { left: 0; }\n  .poker-table-stud .seat-right-top, .poker-table-stud .seat-right-bottom { right: 0; }\n  .stud-card-row { grid-template-columns: 20px 1fr; gap: 2px; }\n  .stud-card-row > div { gap: 1px; min-height: 25px; }\n  .stud-center { top: 52%; min-width: min(190px, 62%); max-width: 62%; padding: 7px 6px; gap: 3px; }\n  .table-action-area { width: 100%; padding-top: 14px; }\n}\n@media (max-width: 420px) {\n  .poker-table { aspect-ratio: .65 / 1; }\n  .poker-seat { min-width: 76px; max-width: 112px; padding: 4px; }\n  .seat-name { font-size: 10px; }\n  .seat-stack { font-size: 8px; }\n  .poker-seat.has-four-cards { min-width: 104px; max-width: 110px; }\n  .poker-table-draw .poker-seat.has-five-cards { min-width: 108px; max-width: 114px; }\n  .poker-table-stud .poker-seat.has-stud-cards { min-width: 100px; max-width: 108px; }\n  .pot-label { width: 54%; }\n  .board { gap: 4px; }\n}\n@media (max-width: 360px) {\n  .poker-table { aspect-ratio: .52 / 1; }\n  .board, .draw-center { top: 52%; }\n  .stud-center { top: 53%; }\n  .street-label { top: 68%; }\n  .table-mark { transform: translate(-50%, 78px); }\n}\n";
    const patchedHtml = html.replace('</style>', `${mobileTableCss}\n</style>`);
    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="loading"><div><strong>HEIGHTEN</strong><small>読み込みに失敗しました。ページを再読み込みしてください。</small></div></div>';
  }
})();
</script>
</body>
</html>
