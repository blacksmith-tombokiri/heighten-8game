<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEIGHTEN | 8-Game Poker Trainer</title>
<meta name="theme-color" content="#0d2d24">
<style>html,body{margin:0;min-height:100%;background:#07130f;color:#f1f2ec;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading strong{letter-spacing:.12em}.loading small{display:block;margin-top:10px;color:#9eb0a9}</style>
</head>
<body>
<div class="loading"><div><strong>HEIGHTEN</strong><small>Loading Mixed Game Trainer...</small></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
    const parts=await Promise.all(Array.from({length:7},async(_,i)=>{
      const path=`.build/p${String(i).padStart(2,'0')}`;
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error(`Failed to load ${path}`);
      return (await response.text()).trim();
    }));
    const encoded=parts.join('');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="loading"><div><strong>HEIGHTEN</strong><small>読み込みに失敗しました。ページを再読み込みしてください。</small></div></div>';
  }
})();
</script>
</body>
</html>
